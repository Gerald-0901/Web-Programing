<!DOCTYPE html>
<html>
    <head>
        <meta charset="'utf-8">
        <title>Halaman Profil bandung</title>
    </head>
    <body>
        <p><strong>HTML</strong> is <i>Hyper Text Markup Language</i> For Structur Web</p>
        <img src="images.png">

        <!-- LIST -->
         <!-- unordered list -->
        <ul>
            <li>good 1</li>
            <li>good 2</li>
            <li>good 3</li>
            <ul>
                <li>nested list 1</li>
                <li>nested list 2</li>
            </ul>
        </ul>

        <!-- ordered list -->
        <ol type="A" reversed>
            <li>good 1</li>
            <li>good 2</li>
            <li>good 3</li>
            <ol type="i">
                <li>nested list 1</li>
                <li>nested list 2</li>
            </ol>
        </ol>

    </body>
</html>
